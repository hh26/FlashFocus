<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark Zinc Background (Tailwind zinc-950) -->
  <rect width="512" height="512" rx="112" fill="#09090b" />
  
  <!-- Back Flashcard (Rotated right) -->
  <g transform="rotate(12 256 256)">
    <rect x="146" y="116" width="220" height="280" rx="24" fill="#18181b" stroke="#3f3f46" stroke-width="12" />
  </g>
  
  <!-- Front Flashcard (Rotated left, Tailwind indigo-500 stroke) -->
  <g transform="rotate(-6 256 256)">
    <rect x="146" y="116" width="220" height="280" rx="24" fill="#18181b" stroke="#6366f1" stroke-width="16" />
    
    <!-- Decorative Question Lines -->
    <rect x="186" y="170" width="140" height="12" rx="6" fill="#3f3f46" />
    <rect x="186" y="200" width="90" height="12" rx="6" fill="#3f3f46" />
    
    <!-- Lightning / Focus Element (Tailwind indigo-400) -->
    <path d="M266 230 L216 290 L256 290 L246 350 L306 270 L266 270 Z" fill="#818cf8" stroke="#818cf8" stroke-linejoin="round" stroke-width="4" />
  </g>
</svg>
